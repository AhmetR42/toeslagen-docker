# Docker Swarm-variant (optioneel)
# Gebruik:
#   docker swarm init
#   docker compose build                      # bouwt toeslagen-app:latest
#   set -a; . ./.env; set +a                  # variabelen laden voor ${...}
#   docker stack deploy -c docker-compose.swarm.yml toeslagen
# Let op: zet APP_KEY in .env, zodat alle replicas dezelfde sleutel gebruiken.

services:
  app:
    image: toeslagen-app:latest
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:80"
    networks:
      - backend
    deploy:
      replicas: 2
      update_config:
        parallelism: 1        # rolling update: één container tegelijk
        delay: 10s
        order: start-first    # nieuwe eerst starten, dan oude stoppen
        failure_action: rollback
      restart_policy:
        condition: on-failure

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    deploy:
      replicas: 1             # database niet schalen (één schrijver)
      endpoint_mode: dnsrr    # app vindt db direct via DNS (geen VIP nodig voor 1 replica)
      placement:
        constraints: [node.role == manager]

volumes:
  db_data:

networks:
  backend:
    driver: overlay
