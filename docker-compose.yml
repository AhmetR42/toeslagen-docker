name: toeslagen

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: toeslagen-app:latest
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db            # service-naam, geen localhost
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Draait alleen bij een lege database (eerste start of na down -v)
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  app_storage:

networks:
  backend:
    driver: bridge
